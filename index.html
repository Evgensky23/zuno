<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Zuno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zuno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Set the theme before first paint to avoid a flash.
  (function () {
    var t = null;
    try { t = (JSON.parse((localStorage.getItem('zuno.v1') || localStorage.getItem('tally.v1'))) || {}).theme; } catch (e) {}
    if (!t) t = 'light';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var sc = 'classic';
    try { sc = ((JSON.parse(localStorage.getItem('zuno.v1')) || {}).settings || {}).scheme || 'classic'; } catch (e) {}
    document.documentElement.dataset.scheme = sc;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="zuno-flame" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#FF3B30"/>
        <stop offset="1" stop-color="#FF9F0A"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="shell">
    <header class="top">
      <div class="top-row">
        <button class="brand" data-view="about" aria-label="About Zuno">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/>
            <path d="M12 3a9 9 0 1 1-9 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg><span>Zuno</span>
        </button>
      </div>
      <nav class="subnav" id="subnav" aria-label="Pages in this section"></nav>
    </header>
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="nav" aria-label="Main"></nav>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
  <script>
    // Offline support; only runs when served over https (or localhost).
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
    }
  </script>
</body>
</html>
